name: Build and publish current release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - oem/**
      - patches/**
      - scripts/**
      - tools/btf.py
      - .github/workflows/build.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify firmware build
        run: python3 scripts/build.py oem/OEM_v0.29.BTF

      - name: Publish source-only release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v1.1 --yes --cleanup-tag 2>/dev/null || true
          gh release create v1.1 \
            --title "RT-950 PRO v1.1" \
            --notes "USB and BLE KISS RX/TX, APRS SMS RX/TX with auto-ACK, OEM beacon display preservation, and Bluetooth programming coexistence." \
            --target "${GITHUB_SHA}"
