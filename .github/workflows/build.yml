name: Build and publish v1.0

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - oem/**
      - patches/**
      - scripts/**
      - tools/btf.py
      - .github/workflows/build.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build v1.0 from repository OEM
        run: python3 scripts/build_v1.py oem/OEM_v0.29.BTF
      - uses: actions/upload-artifact@v4
        with:
          name: RT950_V029_v1.0
          path: |
            build/RT950_V029_v1.0.BTF
            build/RT950_V029_v1.0.firmware.bin
      - name: Publish latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v1.0 --yes --cleanup-tag 2>/dev/null || true
          gh release create v1.0 \
            build/RT950_V029_v1.0.BTF \
            build/RT950_V029_v1.0.firmware.bin \
            --title "RT-950 PRO v1.0" \
            --notes "BLE KISS RX/TX working. USB KISS RX/TX working." \
            --target "${GITHUB_SHA}"
