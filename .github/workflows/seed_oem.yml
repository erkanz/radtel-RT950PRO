name: Seed OEM firmware

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/seed_oem.yml

permissions:
  contents: write

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install archive extractors
        run: sudo apt-get update && sudo apt-get install -y unar p7zip-full
      - name: Prepare OEM v0.29
        run: python3 tools/fetch_oem_v029.py
      - name: Verify and commit OEM
        run: |
          echo "53226024c9b4a782c85556a120afa5e690c132a85bf4048e59d2d193e5eaf272  oem/OEM_v0.29.BTF" | sha256sum -c -
          git config user.name "Erkan"
          git config user.email "40618175+erkanz@users.noreply.github.com"
          git add oem/OEM_v0.29.BTF
          git commit -m "Add OEM v0.29 firmware"
          git push
